name: Publish curated Mihon extensions

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonkor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore personal signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || exit 1
          echo "$SIGNING_KEY" | base64 --decode > signingkey.jks
      - name: Build curated extensions
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEY_STORE_PASSWORD" && test -n "$ALIAS" && test -n "$KEY_PASSWORD" || exit 1
          chmod +x gradlew
          ./gradlew :src:ko:toonkor:spotlessApply :src:ko:goodtoon:spotlessApply :src:ko:toon11:spotlessApply :src:ko:blacktoon:spotlessApply --no-daemon
          ./gradlew :src:ko:toonkor:lintRelease :src:ko:toonkor:assembleRelease :src:ko:goodtoon:lintRelease :src:ko:goodtoon:assembleRelease :src:ko:toon11:lintRelease :src:ko:toon11:assembleRelease :src:ko:blacktoon:lintRelease :src:ko:blacktoon:assembleRelease --no-daemon
      - name: Install index dependency
        run: python -m pip install -r requirements.txt
      - name: Fetch current Android repository
        run: git clone --depth 1 --branch repo "https://github.com/$GITHUB_REPOSITORY.git" existing-repo
      - name: Build curated Android repository
        run: |
          TOONKOR_APK=$(find src/ko/toonkor/build/outputs/apk/release -name 'tachiyomi-ko.toonkor-v1.4.17.apk' -print -quit)
          GOODTOON_APK=$(find src/ko/goodtoon/build/outputs/apk/release -name 'tachiyomi-ko.goodtoonwebtoontest-v1.4.9.apk' -print -quit)
          TOON11_APK=$(find src/ko/toon11/build/outputs/apk/release -name 'tachiyomi-ko.toon11-v1.4.29.apk' -print -quit)
          BLACKTOON_APK=$(find src/ko/blacktoon/build/outputs/apk/release -name 'tachiyomi-ko.blacktoon-v1.4.34.apk' -print -quit)
          test -n "$TOONKOR_APK" && test -n "$GOODTOON_APK" && test -n "$TOON11_APK" && test -n "$BLACKTOON_APK"
          python scripts/make_android_repo.py --existing existing-repo --toonkor-apk "$TOONKOR_APK" --toonkor-source-info src/ko/toonkor/build/keiyoushi-source-info.json --toonkor-icon icon/toonkor-gh-v1.4.17.png --goodtoon-apk "$GOODTOON_APK" --goodtoon-source-info src/ko/goodtoon/build/keiyoushi-source-info.json --goodtoon-icon icon/goodtoon-gh-v1.4.9.png --toon11-apk "$TOON11_APK" --toon11-source-info src/ko/toon11/build/keiyoushi-source-info.json --toon11-icon icon/toon11-gh-v1.4.29.png --blacktoon-apk "$BLACKTOON_APK" --blacktoon-source-info src/ko/blacktoon/build/keiyoushi-source-info.json --blacktoon-icon icon/blacktoon-gh-v1.4.33.png --repository "$GITHUB_REPOSITORY"
      - name: Publish repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deploy_android.py
