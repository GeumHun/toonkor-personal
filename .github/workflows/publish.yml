name: Publish Toonkor and DC Manga

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonkor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install index dependency
        run: python -m pip install -r requirements.txt
      - name: Fetch current Android repository
        run: git clone --depth 1 --branch repo "https://github.com/$GITHUB_REPOSITORY.git" existing-repo
      - name: Add original DC Manga APK to Android repository
        run: python scripts/make_android_repo.py --existing existing-repo --repository "$GITHUB_REPOSITORY"
      - name: Publish repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/deploy_android.py
          echo "Mihon: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/repo/index.pb" >> "$GITHUB_STEP_SUMMARY"
